<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sanjana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#FFEAF1;
  --bg-deep:#FFD7E4;
  --blush:#FFC6D9;
  --blush-deep:#FF8FB3;
  --lavender:#C9B6E4;
  --lavender-deep:#A88CD1;
  --sky:#A8D8EA;
  --sky-deep:#7FC2DB;
  --plum:#4A2F5C;
  --plum-soft:#7A5C8F;
  --gold:#FFD97D;
  --white:#FFFFFF;
  --shadow-soft: 0 20px 60px rgba(74,47,92,0.14);
  --shadow-pop: 0 10px 26px rgba(74,47,92,0.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{ height:100%; }
body{
  font-family:'Quicksand', sans-serif;
  background: radial-gradient(ellipse at 50% 0%, #FFF3F7 0%, var(--bg-base) 45%, var(--bg-deep) 100%);
  color:var(--plum);
  overflow:hidden;
  width:100%;
  position:fixed;
  inset:0;
}
h1,h2,h3,.display{ font-family:'Fraunces', serif; }
.handwritten{ font-family:'Caveat', cursive; }
::selection{ background:var(--blush); color:var(--plum); }

/* ---------- Global floating hearts background ---------- */
#hearts-bg{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
#hearts-bg .bg-heart{
  position:absolute; will-change:transform, opacity;
}

/* ---------- App shell / paging system ---------- */
#app{ position:fixed; inset:0; overflow:hidden; }
.page{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:100px 24px 80px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.page.active{ display:flex; }
.page-inner{
  position:relative; z-index:3;
  width:100%; max-width:1000px;
  margin:0 auto;
  text-align:center;
}
.eyebrow{
  font-weight:700; letter-spacing:0.32em; text-transform:uppercase;
  font-size:0.68rem; color:var(--plum-soft); margin-bottom:16px; display:inline-block;
}
.btn{
  font-family:'Quicksand', sans-serif; font-weight:700; font-size:1rem;
  padding:15px 34px; border-radius:999px; border:none; cursor:pointer;
  background:linear-gradient(135deg, var(--blush-deep), var(--lavender-deep));
  color:white; box-shadow:var(--shadow-pop);
  transition:transform 0.22s ease, box-shadow 0.22s ease;
}
.btn:hover{ transform:translateY(-3px) scale(1.03); box-shadow:0 16px 36px rgba(168,140,209,0.5); }
.btn:active{ transform:translateY(0) scale(0.97); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
.btn.secondary{ background:white; color:var(--plum); box-shadow:0 6px 18px rgba(74,47,92,0.12); }

/* ---------- Top nav ---------- */
#top-nav{
  position:fixed; top:0; left:0; right:0; z-index:80;
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:14px 12px 10px;
  background:linear-gradient(to bottom, rgba(255,248,245,0.96), rgba(255,248,245,0));
  pointer-events:none;
}
#top-nav .nav-inner{
  pointer-events:auto;
  display:flex; gap:4px; background:white; padding:6px; border-radius:999px;
  box-shadow:var(--shadow-pop); max-width:100%; overflow-x:auto;
}
.nav-btn{
  font-family:'Quicksand',sans-serif; font-weight:600; font-size:0.72rem;
  border:none; background:transparent; color:var(--plum-soft);
  padding:9px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;
  transition:background 0.25s ease, color 0.25s ease;
  display:flex; align-items:center; gap:6px;
}
.nav-btn .stamp{ font-size:0.85rem; }
.nav-btn.active{ background:var(--plum); color:white; }

/* ---------- Prev/Next arrows ---------- */
.page-arrow{
  position:fixed; top:50%; transform:translateY(-50%); z-index:70;
  width:48px; height:48px; border-radius:50%; border:none;
  background:white; box-shadow:var(--shadow-pop); cursor:pointer;
  font-size:1.2rem; color:var(--plum); display:flex; align-items:center; justify-content:center;
  transition:transform 0.2s ease;
}
.page-arrow:hover{ transform:translateY(-50%) scale(1.1); }
.page-arrow:disabled{ opacity:0.25; cursor:not-allowed; }
#arrow-prev{ left:14px; }
#arrow-next{ right:14px; }

/* ---------- Sound toggle ---------- */
#sound-toggle{
  position:fixed; top:16px; right:16px; z-index:90;
  width:46px; height:46px; border-radius:50%; border:none;
  background:white; box-shadow:var(--shadow-pop); cursor:pointer;
  font-size:1.2rem; display:flex; align-items:center; justify-content:center;
  transition:transform 0.2s ease;
}
#sound-toggle:hover{ transform:scale(1.08); }

#thread-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.6; }

/* ---------- Waterfall Gallery ---------- */
#waterfall-stage{
  display:flex; gap:14px; width:100%; max-width:820px; height:480px;
  margin:0 auto 22px; overflow:hidden; border-radius:24px;
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
  mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
}
.waterfall-col{ flex:1; position:relative; overflow:hidden; min-width:0; }
.waterfall-track{
  position:absolute; top:0; left:0; right:0;
  display:flex; flex-direction:column; gap:14px;
  animation-timing-function:linear; animation-iteration-count:infinite;
}
.waterfall-col[data-dir="down"] .waterfall-track{ animation-name:waterfallDown; }
.waterfall-col[data-dir="up"] .waterfall-track{ animation-name:waterfallUp; }
.waterfall-col:hover .waterfall-track{ animation-play-state:paused; }
.waterfall-track.paused-all{ animation-play-state:paused !important; }
@keyframes waterfallDown{ from{ transform:translateY(-50%); } to{ transform:translateY(0%); } }
@keyframes waterfallUp{ from{ transform:translateY(0%); } to{ transform:translateY(-50%); } }
.wf-photo{
  position:relative; border-radius:16px; overflow:hidden; cursor:pointer;
  box-shadow:0 10px 26px rgba(74,47,92,0.18); background:white;
  transition:transform 0.25s ease, box-shadow 0.25s ease;
}
.wf-photo:hover{ transform:scale(1.04); box-shadow:0 16px 36px rgba(74,47,92,0.28); z-index:2; }
.wf-photo img{ width:100%; display:block; object-fit:cover; aspect-ratio:3/4; }
.wf-photo .cap{
  position:absolute; bottom:0; left:0; right:0; padding:10px 12px;
  background:linear-gradient(to top, rgba(74,47,92,0.78), transparent);
  color:white; font-size:0.72rem; font-weight:600; text-align:left;
  opacity:0; transition:opacity 0.25s ease;
}
.wf-photo:hover .cap{ opacity:1; }
.rolodex-controls{ display:flex; justify-content:center; gap:14px; align-items:center; margin-top:6px; }
.rolodex-round-btn{
  width:42px; height:42px; border-radius:50%; border:none; background:white;
  box-shadow:var(--shadow-pop); cursor:pointer; font-size:1rem; color:var(--plum);
}
.rolodex-round-btn:hover{ transform:scale(1.08); }

/* ---------- Modal / lightbox ---------- */
#lightbox{
  position:fixed; inset:0; background:rgba(74,47,92,0.78); backdrop-filter:blur(6px);
  z-index:200; display:none; align-items:center; justify-content:center; padding:24px;
}
#lightbox .box{ max-width:480px; width:100%; background:white; border-radius:22px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.35); }
#lightbox img{ width:100%; display:block; }

/* ---------- Arcade hub cards ---------- */
.arcade-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:20px; margin:34px 0; }
.arcade-card{
  background:white; border-radius:22px; padding:28px 20px; box-shadow:var(--shadow-soft);
  cursor:pointer; transition:transform 0.25s ease, box-shadow 0.25s ease; position:relative;
}
.arcade-card:hover{ transform:translateY(-6px); box-shadow:0 24px 50px rgba(74,47,92,0.2); }
.arcade-card .icon{ font-size:2.4rem; margin-bottom:10px; }
.arcade-card .done-badge{
  position:absolute; top:14px; right:14px; background:var(--gold); color:var(--plum);
  font-size:0.7rem; font-weight:700; padding:4px 10px; border-radius:999px; display:none;
}
.arcade-card.completed .done-badge{ display:block; }
.passport-track{ display:flex; justify-content:center; gap:10px; margin:18px 0 6px; flex-wrap:wrap; }
.passport-stamp{
  font-size:0.75rem; font-weight:700; padding:6px 14px; border-radius:999px;
  background:#f1eaf7; color:var(--plum-soft); transition:all 0.3s ease;
}
.passport-stamp.done{ background:var(--gold); color:var(--plum); }

/* ---------- Memory match cards ---------- */
#memory-match-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:420px; margin:0 auto; }
.mm-card{ aspect-ratio:1/1; border-radius:12px; cursor:pointer; perspective:600px; }
.mm-card-inner{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 0.5s cubic-bezier(.4,.2,.2,1); }
.mm-card.flipped .mm-card-inner, .mm-card.matched .mm-card-inner{ transform:rotateY(180deg); }
.mm-face{ position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
.mm-front{ background:linear-gradient(135deg, var(--lavender-deep), var(--blush-deep)); color:white; }
.mm-back{ background:white; transform:rotateY(180deg); box-shadow:inset 0 0 0 2px var(--lavender); }
.mm-card.matched .mm-back{ box-shadow:inset 0 0 0 2px var(--gold); }

/* ---------- Quiz ---------- */
#quiz-card{ background:white; border-radius:24px; padding:36px 28px; box-shadow:var(--shadow-soft); max-width:520px; margin:0 auto; }
.quiz-option{
  display:block; width:100%; text-align:left; padding:14px 18px; margin-top:10px;
  border-radius:14px; border:2px solid #f1eaf7; background:white; cursor:pointer;
  font-family:'Quicksand',sans-serif; font-weight:600; color:var(--plum); transition:all 0.2s ease;
}
.quiz-option:hover{ border-color:var(--lavender-deep); background:#faf6ff; }
.quiz-option.picked{ background:var(--gold); border-color:var(--gold); }
#quiz-progress-bar{ height:6px; border-radius:6px; background:#f1eaf7; overflow:hidden; margin-bottom:22px; }
#quiz-progress-fill{ height:100%; background:linear-gradient(90deg,var(--blush-deep),var(--lavender-deep)); width:0%; transition:width 0.4s ease; }

/* ---------- Hidden hearts ---------- */
#hearts-scene{ position:relative; width:100%; max-width:560px; margin:0 auto; aspect-ratio:16/10; border-radius:20px; background:linear-gradient(135deg, var(--sky), var(--lavender)); overflow:hidden; box-shadow:var(--shadow-soft); }
.hidden-heart{ position:absolute; font-size:1.8rem; cursor:pointer; opacity:0.16; transition:transform 0.25s ease; }

/* ---------- Puzzle piece (photo rebuild) kept as bonus mini-task inside letter chapter ---------- */
.puzzle-piece{ border-radius:10px; overflow:hidden; cursor:grab; box-shadow:0 6px 16px rgba(74,47,92,0.15); }

/* ---------- Balloons ---------- */
.balloon{ width:54px; height:68px; border-radius:50%/60% 60% 40% 40%; position:relative; cursor:pointer; box-shadow:inset -8px -8px 14px rgba(0,0,0,0.12); }

@media (max-width: 720px){
  .page{ padding:90px 16px 70px; }
  #waterfall-stage{ height:380px; max-width:100%; gap:8px; }
  .page-arrow{ width:40px; height:40px; font-size:1rem; }
}
</style>
</head>
<body>

<canvas id="thread-canvas"></canvas>
<div id="hearts-bg"></div>
<button id="sound-toggle" aria-label="Toggle sound">🔇</button>
<nav id="top-nav"><div class="nav-inner"></div></nav>
<button class="page-arrow" id="arrow-prev">←</button>
<button class="page-arrow" id="arrow-next">→</button>

<div id="app"></div>

<div id="lightbox">
  <div class="box">
    <img id="lightbox-img" src=""/>
    <div style="padding:18px 24px;">
      <p id="lightbox-caption" class="handwritten" style="font-size:1.35rem; color:var(--plum);"></p>
      <button class="btn secondary" id="lightbox-close" style="margin-top:10px; padding:9px 22px; font-size:0.82rem;">close</button>
    </div>
  </div>
</div>

<canvas id="confetti-canvas" style="position:fixed; inset:0; pointer-events:none; z-index:250;"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="app.js"></script>
</body>
</html>
